<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Grand Hotel - Booking</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #d4af37;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #d4af37;
        }

        .booking-container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 15px #ccc;
        }

        .booking-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row div {
            flex: 1;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            background-color: #d4af37;
            color: white;
            font-size: 17px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #b89525;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #333;
            text-decoration: none;
        }

        footer {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Royal Grand Hotel</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#rooms">Rooms</a>
        <a href="index.html#facilities">Facilities</a>
        <a href="booking.html">Book Now</a>
    </nav>
</header>

<div class="booking-container">

    <h2>Hotel Reservation</h2>

    <form>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter your phone number" required>

        <div class="row">

            <div>
                <label for="checkin">Check-in Date</label>
                <input type="date" id="checkin" name="checkin" required>
            </div>

            <div>
                <label for="checkout">Check-out Date</label>
                <input type="date" id="checkout" name="checkout" required>
            </div>

        </div>

        <label for="room">Select Room</label>
        <select id="room" name="room" required>
            <option value="">-- Select Room Type --</option>
            <option value="deluxe">Deluxe Room - ₹4,500</option>
            <option value="executive">Executive Room - ₹6,500</option>
            <option value="suite">Luxury Suite - ₹9,000</option>
        </select>

        <div class="row">

            <div>
                <label for="adults">Adults</label>
                <input type="number" id="adults"
                       name="adults" min="1" value="1">
            </div>

            <div>
                <label for="children">Children</label>
                <input type="number" id="children"
                       name="children" min="0" value="0">
            </div>

        </div>

        <label for="requests">Special Requests</label>
        <textarea id="requests" name="requests"
                  rows="4"
                  placeholder="Any special requirements?"></textarea>

        <button type="submit">Confirm Booking</button>

    </form>

    <a href="index.html" class="back">← Back to Home</a>

</div>

<footer>
    <p>&copy; 2026 Royal Grand Hotel. All Rights Reserved.</p>
</footer>

</body>
</html>
