<!DOCTYPE html>
<html>
<head>
    <title>Royal Grand Hotel - Contact</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            color: #d4af37;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #d4af37;
        }

        .contact {
            width: 80%;
            max-width: 700px;
            background-color: white;
            margin: 40px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        .contact h2 {
            text-align: center;
        }

        .info {
            margin: 20px 0;
            line-height: 1.8;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #d4af37;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .back {
            display: block;
            text-align: center;
            margin: 25px;
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>

    <h1>Royal Grand Hotel</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="booking.html">Booking</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>

<div class="contact">

    <h2>Contact Us</h2>

    <div class="info">

        <p>📍 <b>Address:</b> 25 MG Road, Coimbatore, Tamil Nadu</p>

        <p>📞 <b>Phone:</b> +91 98765 43210</p>

        <p>📧 <b>Email:</b> royalgrandhotel@gmail.com</p>

        <p>🕐 <b>Reception:</b> Open 24 Hours</p>

    </div>

    <h2>Send Us a Message</h2>

    <form>

        <label>Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Message</label>
        <textarea rows="5"
                  placeholder="Write your message"></textarea>

        <button type="submit">Send Message</button>

    </form>

</div>

<a href="index.html" class="back">← Back to Home</a>

<footer>

    <p>© 2026 Royal Grand Hotel</p>

</footer>

</body>
</html>
